<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ReturHub Mobile</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            --app-primary: #4f46e5;
            --app-bg: #f8fafc;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--app-bg);
            -webkit-tap-highlight-color: transparent;
            /* Perbaikan: Jarak bawah diperbesar agar tombol tidak tertutup bottom nav */
            padding-bottom: calc(120px + env(safe-area-inset-bottom)); 
        }

        /* Custom Scrollbar */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Card Style ala Mobile App */
        .app-card {
            background: white;
            border-radius: 20px;
            border: 1px solid #f1f5f9;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        /* Bottom Nav Transition */
        .nav-active {
            color: var(--app-primary) !important;
            transform: translateY(-4px);
        }
        .nav-active i {
            background: #eef2ff;
            padding: 8px;
            border-radius: 12px;
        }

        /* Tab Animation */
        .tab-content { display: none; }
        .tab-content.active { 
            display: block; 
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Input Mobile Focus & iOS Fixes */
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--app-primary) !important;
            background-color: white !important;
        }
        
        /* Fix Safari/iOS Date Input Styling */
        input[type="date"] {
            -webkit-appearance: none;
            appearance: none;
            min-height: 44px; /* Ensure tap target size */
            background-color: #f8fafc;
        }
        input[type="date"]::-webkit-date-and-time-value {
            text-align: left;
        }

        /* Autocomplete positioning */
        .custom-select-options {
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
        }
        .custom-select-options.active { display: block; }

        /* Loader */
        #premiumLoader {
            background: radial-gradient(circle at center, #1e293b, #0f172a);
        }
    </style>
</head>
<body class="text-slate-800">

    <!-- Premium Loader -->
    <div id="premiumLoader" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center transition-all duration-700 w-full h-full">
        <div class="relative mb-6">
            <div class="w-20 h-20 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
            <div class="absolute inset-0 flex items-center justify-center">
                <i class="ph-fill ph-rocket-launch text-3xl text-indigo-400"></i>
            </div>
        </div>
        <h2 class="text-2xl font-bold text-white tracking-tight">Retur<span class="text-indigo-400">Hub</span></h2>
        <p class="text-slate-400 text-xs mt-2 tracking-[0.2em] animate-pulse">MEMUAT SISTEM...</p>
    </div>

    <!-- Top Header -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-100 px-6 py-4 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-extrabold tracking-tight text-slate-900">Retur<span class="text-indigo-600">Hub</span></h1>
            <p id="headerSubtitle" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Input System v2.0</p>
        </div>
        <div class="flex gap-3">
            <button onclick="refreshHistory()" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-600 active:scale-90 transition-transform">
                <i class="ph-bold ph-arrows-clockwise text-xl"></i>
            </button>
            <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600">
                <i class="ph-fill ph-user text-xl"></i>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-xl mx-auto px-4 pt-4">
        
        <!-- Tab 1: Input -->
        <div id="content-input" class="tab-content active">
            <div class="flex items-center justify-between mb-4 px-2">
                <h2 id="formTitle" class="text-lg font-extrabold text-slate-800">Formulir Laporan</h2>
                <button type="button" id="cancelEditBtn" onclick="resetEditMode()" class="hidden text-xs font-bold text-red-500 bg-red-50 px-3 py-1.5 rounded-full">
                    Batal Edit
                </button>
            </div>

            <form id="returForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <!-- Section: Armada -->
                <div class="app-card p-5 space-y-4">
                    <div class="flex items-center gap-2 mb-1">
                        <i class="ph-fill ph-truck text-indigo-500"></i>
                        <span class="text-[11px] font-black uppercase tracking-wider text-slate-400">Data Armada</span>
                    </div>
                    <!-- PERBAIKAN: Layout diubah menggunakan flex min-w-0 untuk mencegah overflow pada HP -->
                    <div class="flex gap-3 w-full">
                        <div class="space-y-1 flex-1 min-w-0">
                            <label class="text-[10px] font-bold text-slate-500 ml-1">TANGGAL</label>
                            <input type="date" name="tanggal" required class="w-full min-w-0 block appearance-none bg-slate-50 border border-slate-100 rounded-xl px-3 py-3 text-sm font-bold text-slate-800">
                        </div>
                        <div class="space-y-1 flex-1 min-w-0">
                            <label class="text-[10px] font-bold text-slate-500 ml-1">NO. POLISI</label>
                            <input type="text" name="noPol" placeholder="B 1234 ABC" required class="w-full min-w-0 block appearance-none bg-slate-50 border border-slate-100 rounded-xl px-3 py-3 text-sm font-bold text-slate-800 uppercase placeholder:normal-case">
                        </div>
                    </div>
                </div>

                <!-- Section: Lokasi -->
                <div class="app-card p-5 space-y-4">
                    <div class="flex items-center gap-2 mb-1">
                        <i class="ph-fill ph-storefront text-purple-500"></i>
                        <span class="text-[11px] font-black uppercase tracking-wider text-slate-400">Informasi Toko</span>
                    </div>
                    <div class="relative" id="storeSelectContainer">
                        <input type="text" id="storeSearch" name="kodeToko" autocomplete="off" placeholder="Cari Kode Toko..." required 
                               class="w-full block appearance-none bg-slate-50 border border-slate-100 rounded-xl px-4 py-3 text-sm font-bold uppercase">
                        <div id="storeOptions" class="custom-select-options absolute w-full mt-1 bg-white border border-slate-100 rounded-xl py-2"></div>
                    </div>
                    <input type="text" id="namaTokoInput" name="namaToko" placeholder="Nama Toko Otomatis..." readonly 
                           class="w-full block appearance-none bg-slate-100 border border-slate-100 rounded-xl px-4 py-3 text-sm font-bold text-slate-400 cursor-not-allowed">
                    <div class="relative" id="groupSelectContainer">
                        <input type="text" id="groupSearch" name="grup" autocomplete="off" placeholder="Pilih Grup Cabang..." required 
                               class="w-full block appearance-none bg-slate-50 border border-slate-100 rounded-xl px-4 py-3 text-sm font-bold uppercase">
                        <div id="groupOptions" class="custom-select-options absolute w-full mt-1 bg-white border border-slate-100 rounded-xl py-2"></div>
                    </div>
                </div>

                <!-- Section: Produk -->
                <div class="app-card p-5 space-y-4">
                    <div class="flex items-center gap-2 mb-1">
                        <i class="ph-fill ph-package text-emerald-500"></i>
                        <span class="text-[11px] font-black uppercase tracking-wider text-slate-400">Detail Barang</span>
                    </div>
                    <div class="relative" id="productSelectContainer">
                        <input type="text" id="productSearch" name="deskripsi" autocomplete="off" placeholder="Cari Nama Produk / SKU..." required 
                               class="w-full block appearance-none bg-slate-50 border border-slate-100 rounded-xl px-4 py-3 text-sm font-bold">
                        <div id="productOptions" class="custom-select-options absolute w-full mt-1 bg-white border border-slate-100 rounded-xl py-2"></div>
                    </div>
                    <!-- PERBAIKAN: Layout Kategori dan QTY juga disesuaikan -->
                    <div class="flex gap-3 w-full">
                        <div class="flex-1 min-w-0">
                            <select name="kategori" id="categorySelect" class="w-full min-w-0 block appearance-none bg-slate-50 border border-slate-100 rounded-xl px-3 py-3 text-sm font-bold text-slate-800">
                                <option value="">Pilih Suhu</option>
                            </select>
                        </div>
                        <div class="relative flex-1 min-w-0">
                            <input type="number" id="qtyInput" name="qty" placeholder="QTY" required min="1" 
                                   class="w-full min-w-0 block appearance-none bg-slate-50 border border-slate-100 rounded-xl px-3 py-3 text-sm font-black text-indigo-600 text-center">
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-[9px] font-bold text-slate-400">PCS</span>
                        </div>
                    </div>
                </div>

                <!-- Section: Keterangan -->
                <div class="app-card p-5 space-y-4">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <i class="ph-fill ph-info text-amber-500"></i>
                            <span class="text-[11px] font-black uppercase tracking-wider text-slate-400">Catatan</span>
                        </div>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <span id="fakturLabel" class="text-[10px] font-bold text-slate-400 uppercase">Faktur?</span>
                            <input type="checkbox" id="fakturCheckbox" name="fakturCheckbox" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
                        </label>
                    </div>
                    <select name="keterangan" id="ketInput" required class="w-full block appearance-none bg-slate-50 border border-slate-100 rounded-xl px-4 py-3 text-sm font-bold text-slate-800">
                        <option value="" disabled selected>Pilih Alasan Balikan</option>
                        <option value="SJI">SJI</option>
                        <option value="GAGAL KIRIM">GAGAL KIRIM</option>
                        <option value="SUSULAN">SUSULAN</option>
                    </select>
                    <textarea name="notes" rows="2" placeholder="Catatan tambahan..." 
                              class="w-full block appearance-none bg-slate-50 border border-slate-100 rounded-xl px-4 py-3 text-sm font-medium text-slate-800 resize-none"></textarea>
                </div>

                <!-- Action Button -->
                <div class="flex gap-3 pt-4 pb-8">
                    <label class="flex-1 bg-white border border-slate-100 rounded-2xl p-3 flex items-center gap-3 shadow-sm active:bg-slate-50 transition-colors cursor-pointer">
                        <input type="checkbox" id="keepDataCheck" class="w-5 h-5 rounded-full border-slate-300 text-indigo-600 focus:ring-0">
                        <div class="leading-none">
                            <p class="text-[11px] font-bold text-slate-800">Multi-Input</p>
                            <p class="text-[9px] text-slate-400 mt-0.5">Simpan berulang</p>
                        </div>
                    </label>
                    <button type="submit" id="submitBtn" class="flex-[2] bg-indigo-600 text-white rounded-2xl font-bold py-4 shadow-lg shadow-indigo-100 active:scale-95 transition-transform flex items-center justify-center gap-2">
                        <i class="ph-bold ph-paper-plane-tilt"></i>
                        Simpan Data
                    </button>
                </div>
            </form>
        </div>

        <!-- Tab 2: Database (Mobile Optimized) -->
        <div id="content-display" class="tab-content">
            <div class="mb-4">
                <div class="relative">
                    <i class="ph-bold ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="liveSearchInput" placeholder="Cari data riwayat..." 
                           class="w-full bg-white border-none rounded-2xl pl-11 pr-4 py-3.5 text-sm font-medium shadow-sm">
                </div>
            </div>
            
            <div id="mobileHistoryList" class="space-y-3 pb-6">
                <!-- Data will be injected here as Cards -->
            </div>
        </div>

        <!-- Tab 3: Analytics -->
        <div id="content-dashboard" class="tab-content">
            <div class="grid grid-cols-2 gap-3 mb-6">
                <div class="app-card p-4 bg-indigo-600 text-white">
                    <p class="text-[10px] font-bold uppercase opacity-60">Total Item</p>
                    <h3 id="stat-total" class="text-2xl font-black mt-1">0</h3>
                </div>
                <div class="app-card p-4 bg-emerald-500 text-white">
                    <p class="text-[10px] font-bold uppercase opacity-60">Total Qty</p>
                    <h3 id="stat-qty" class="text-2xl font-black mt-1">0</h3>
                </div>
            </div>

            <div class="space-y-4">
                <div class="app-card p-5">
                    <h4 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Top 5 Armada</h4>
                    <div class="h-60">
                        <canvas id="chartArmada"></canvas>
                    </div>
                </div>
                <div class="app-card p-5">
                    <h4 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Distribusi Suhu</h4>
                    <div class="h-60">
                        <canvas id="chartSuhu"></canvas>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 px-6 pt-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))] flex justify-between items-center z-[50] shadow-[0_-4px_10px_rgba(0,0,0,0.02)]">
        <button onclick="switchTab('input')" id="tab-input" class="nav-btn flex flex-col items-center gap-1 text-slate-400 nav-active transition-all">
            <i class="ph-bold ph-pencil-simple text-xl"></i>
            <span class="text-[10px] font-bold">Input</span>
        </button>
        <button onclick="switchTab('display')" id="tab-display" class="nav-btn flex flex-col items-center gap-1 text-slate-400 transition-all">
            <i class="ph-bold ph-database text-xl"></i>
            <span class="text-[10px] font-bold">Riwayat</span>
        </button>
        <button onclick="switchTab('dashboard')" id="tab-dashboard" class="nav-btn flex flex-col items-center gap-1 text-slate-400 transition-all">
            <i class="ph-bold ph-chart-pie-slice text-xl"></i>
            <span class="text-[10px] font-bold">Analitik</span>
        </button>
    </nav>

    <script>
        // Masukkan URL Web App Google Apps Script Anda
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyjq2MUWsAjQakdunowMWMVwXT4UEFV79YWSPxOjFwza0f0JsM_bLa1paNDYdrdPDI/exec"; 

        let rawHistoryData = []; 
        let armadaChartInstance = null;
        let suhuChartInstance = null;
        let currentEditRowIndex = null; 

        window.onload = function() {
            if (!SCRIPT_URL) {
                Swal.fire('Config Error', 'SCRIPT_URL is missing!', 'error');
                document.getElementById('premiumLoader').style.display = 'none';
                return;
            }

            fetch(`${SCRIPT_URL}?action=getInitialData`)
                .then(r => r.json())
                .then(data => initApp(data))
                .catch(e => {
                    console.error(e);
                    document.getElementById('premiumLoader').style.display = 'none';
                    Swal.fire('Koneksi Gagal', 'Pastikan URL GAS benar.', 'error');
                });
        };

        function initApp(data) {
            const loader = document.getElementById('premiumLoader');
            loader.style.opacity = '0';
            setTimeout(() => { loader.style.display = 'none'; }, 500);

            // Setup Custom Selects
            setupCustomSelect('storeSearch', 'storeOptions', data.stores, false, (sel) => {
                if(sel) document.getElementById('namaTokoInput').value = sel.nama || '';
            });

            setupCustomSelect('productSearch', 'productOptions', data.products, true, (sel) => {
                if(sel && sel.cat) {
                    const catSelect = document.getElementById('categorySelect');
                    catSelect.value = sel.cat.toUpperCase();
                }
            });

            const uniqueGroups = [...new Set(data.stores.map(s => s.grup).filter(Boolean))].sort();
            setupCustomSelect('groupSearch', 'groupOptions', uniqueGroups);

            const catSelect = document.getElementById('categorySelect');
            catSelect.innerHTML = '<option value="">Pilih Suhu</option>' + 
                                  data.categories.map(c => `<option value="${c}">${c}</option>`).join('');
            
            refreshHistory();
        }

        function setupCustomSelect(inputId, optionsId, items, isProduct = false, onSelectCallback = null) {
            const input = document.getElementById(inputId);
            const container = document.getElementById(optionsId);

            function filter(val) {
                const search = val.toLowerCase();
                const filtered = items.filter(item => {
                    const text = isProduct ? (item.label + " " + item.sub) : (typeof item === 'string' ? item : item.label + " " + item.nama);
                    return text.toLowerCase().includes(search);
                }).slice(0, 15);

                container.innerHTML = filtered.length ? '' : '<div class="p-4 text-slate-400 text-xs text-center font-bold">Data tidak ditemukan</div>';
                
                filtered.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'px-4 py-3 border-b border-slate-50 last:border-0 active:bg-indigo-50';
                    
                    if(isProduct) {
                        div.innerHTML = `<div class="font-bold text-sm text-slate-800">${item.label}</div>
                                         <div class="text-[10px] text-slate-400">SKU: ${item.sub} | <span class="text-indigo-500">${item.cat}</span></div>`;
                    } else if (typeof item === 'string') {
                        div.innerHTML = `<div class="font-bold text-sm text-slate-800 uppercase">${item}</div>`;
                    } else {
                        div.innerHTML = `<div class="font-bold text-sm text-slate-800">${item.label}</div>
                                         <div class="text-[10px] text-slate-400">${item.nama}</div>`;
                    }

                    div.onclick = () => {
                        input.value = (typeof item === 'string') ? item : item.label;
                        container.classList.remove('active');
                        if(onSelectCallback) onSelectCallback(item);
                    };
                    container.appendChild(div);
                });
            }

            input.oninput = (e) => filter(e.target.value);
            input.onfocus = () => { container.classList.add('active'); filter(input.value); };
            
            document.addEventListener('click', (e) => {
                if (!input.parentElement.contains(e.target)) container.classList.remove('active');
            });
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-active'));
            
            document.getElementById(`content-${tab}`).classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('nav-active');

            if (tab === 'display' || tab === 'dashboard') refreshHistory();
            
            // Auto update header subtitle
            const titles = { 'input': 'Input System v2.0', 'display': 'Database Riwayat', 'dashboard': 'Data Analytics' };
            document.getElementById('headerSubtitle').innerText = titles[tab];
        }

        function refreshHistory() {
            if (!SCRIPT_URL) return;
            fetch(`${SCRIPT_URL}?action=getDataHistory`)
                .then(r => r.json())
                .then(data => {
                    rawHistoryData = data || [];
                    renderHistoryList(rawHistoryData);
                    buildDashboard(rawHistoryData);
                });
        }

        function renderHistoryList(data) {
            const list = document.getElementById('mobileHistoryList');
            if (!data.length) {
                list.innerHTML = `<div class="text-center py-20 text-slate-300">
                                    <i class="ph-bold ph-tray text-4xl"></i>
                                    <p class="text-xs font-bold mt-2">Belum ada riwayat</p>
                                  </div>`;
                return;
            }

            list.innerHTML = data.slice(0, 30).map(row => `
                <div class="app-card p-4 flex justify-between items-start gap-4">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-[10px] font-black bg-slate-100 text-slate-600 px-2 py-0.5 rounded">${row.noPol}</span>
                            <span class="text-[9px] font-bold text-slate-400">${row.tanggalTampil}</span>
                        </div>
                        <h4 class="text-sm font-bold text-slate-800 truncate">${row.deskripsi}</h4>
                        <p class="text-[10px] text-slate-500 truncate mt-0.5">${row.namaToko} (${row.kodeToko})</p>
                        <div class="flex items-center gap-2 mt-2">
                            <span class="text-[8px] font-extrabold border border-indigo-100 text-indigo-600 px-1.5 py-0.5 rounded uppercase">${row.kategori}</span>
                            <span class="text-[8px] font-extrabold border border-amber-100 text-amber-600 px-1.5 py-0.5 rounded uppercase">${row.ket || 'N/A'}</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-end gap-3">
                        <div class="bg-indigo-50 text-indigo-600 w-10 h-10 rounded-xl flex items-center justify-center font-black text-xs">
                            ${row.qty}
                        </div>
                        <button onclick="editData(${row.rowIndex})" class="text-amber-500 active:scale-90 transition-transform">
                            <i class="ph-bold ph-pencil-simple text-xl"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('liveSearchInput').oninput = (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = rawHistoryData.filter(r => 
                (r.noPol + r.deskripsi + r.namaToko + r.kodeToko).toLowerCase().includes(term)
            );
            renderHistoryList(filtered);
        };

        function handleFormSubmit(e) {
            e.preventDefault();
            const form = e.target;
            const data = Object.fromEntries(new FormData(form).entries());
            const isEditing = currentEditRowIndex !== null;

            Swal.fire({
                title: 'Mengirim Data...',
                html: '<div class="flex justify-center p-4"><div class="w-10 h-10 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div></div>',
                showConfirmButton: false, allowOutsideClick: false
            });

            const payload = {
                ...data,
                faktur: document.getElementById('fakturCheckbox').checked,
                action: isEditing ? 'updateForm' : 'submitForm',
                rowIndex: currentEditRowIndex
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(res => {
                if(res.status === 'success') {
                    Swal.fire({ icon: 'success', title: 'Berhasil!', text: 'Laporan telah tersimpan.', timer: 1500, showConfirmButton: false });
                    
                    if(isEditing) {
                        resetEditMode();
                        switchTab('display');
                    } else if (!document.getElementById('keepDataCheck').checked) {
                        form.reset();
                    } else {
                        // Keep armada but reset product
                        document.getElementById('productSearch').value = '';
                        document.getElementById('qtyInput').value = '';
                    }
                    refreshHistory();
                } else {
                    Swal.fire('Error', res.message, 'error');
                }
            });
        }

        function editData(idx) {
            const r = rawHistoryData.find(x => x.rowIndex === idx);
            if(!r) return;

            document.querySelector('input[name="tanggal"]').value = r.tanggal;
            document.querySelector('input[name="noPol"]').value = r.noPol;
            document.getElementById('storeSearch').value = r.kodeToko;
            document.getElementById('namaTokoInput').value = r.namaToko;
            document.getElementById('groupSearch').value = r.grup;
            document.getElementById('productSearch').value = r.deskripsi;
            document.getElementById('categorySelect').value = (r.kategori || '').toUpperCase();
            document.getElementById('qtyInput').value = r.qty;
            document.getElementById('ketInput').value = (r.ket || '').toUpperCase();
            document.getElementById('fakturCheckbox').checked = (r.faktur === true || r.faktur === 'ADA FAKTUR');
            document.querySelector('textarea[name="notes"]').value = r.notes || '';

            currentEditRowIndex = idx;
            document.getElementById('formTitle').innerText = "Edit Data #" + idx;
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            document.getElementById('submitBtn').innerText = "Update Data";
            document.getElementById('submitBtn').classList.replace('bg-indigo-600', 'bg-amber-500');

            switchTab('input');
        }

        function resetEditMode() {
            currentEditRowIndex = null;
            document.getElementById('returForm').reset();
            document.getElementById('formTitle').innerText = "Formulir Laporan";
            document.getElementById('cancelEditBtn').classList.add('hidden');
            document.getElementById('submitBtn').innerText = "Simpan Data";
            document.getElementById('submitBtn').classList.replace('bg-amber-500', 'bg-indigo-600');
        }

        function buildDashboard(data) {
            if(!data.length) return;
            
            document.getElementById('stat-total').innerText = data.length;
            document.getElementById('stat-qty').innerText = data.reduce((acc, r) => acc + (Number(r.qty) || 0), 0);

            // Armada Chart
            const armadas = {};
            data.forEach(r => armadas[r.noPol] = (armadas[r.noPol] || 0) + (Number(r.qty) || 0));
            const topArmada = Object.entries(armadas).sort((a,b) => b[1]-a[1]).slice(0,5);

            if(armadaChartInstance) armadaChartInstance.destroy();
            armadaChartInstance = new Chart(document.getElementById('chartArmada'), {
                type: 'bar',
                data: {
                    labels: topArmada.map(x => x[0]),
                    datasets: [{ data: topArmada.map(x => x[1]), backgroundColor: '#6366f1', borderRadius: 8 }]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false, 
                    plugins: { legend: { display: false } },
                    scales: { y: { grid: { display: false } }, x: { grid: { display: false } } }
                }
            });

            // Suhu Chart
            const suhus = {};
            data.forEach(r => suhus[r.kategori] = (suhus[r.kategori] || 0) + 1);

            if(suhuChartInstance) suhuChartInstance.destroy();
            suhuChartInstance = new Chart(document.getElementById('chartSuhu'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(suhus),
                    datasets: [{ data: Object.values(suhus), backgroundColor: ['#3b82f6', '#8b5cf6', '#10b981', '#f59e0b'] }]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10, weight: 'bold' } } } }
                }
            });
        }
    </script>
</body>
</html>
